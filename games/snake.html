<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  body{margin:0;background:#111b21;color:#e9edef;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
  h1{font-size:20px;margin:6px} #score{font-size:16px;margin:4px;color:#25d366;font-weight:700}
  canvas{background:#0b141a;border:2px solid #25d366;border-radius:8px;touch-action:none}
  .pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin-top:12px}
  .pad button{height:52px;font-size:22px;border:0;border-radius:10px;background:#202c33;color:#e9edef}
  .pad button:active{background:#25d366;color:#111}
  #over{display:none;text-align:center;margin-top:10px}
  #over button{background:#25d366;color:#111;border:0;padding:10px 22px;border-radius:8px;font-weight:700;font-size:16px}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div id="score">Score: 0</div>
<canvas id="c" width="330" height="330"></canvas>
<div id="over"><p id="final"></p><button onclick="reset()">▶ Play again</button></div>
<div class="pad">
  <span></span><button data-d="up">⬆️</button><span></span>
  <button data-d="left">⬅️</button><button data-d="down">⬇️</button><button data-d="right">➡️</button>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),N=15,S=22;
let snake,dir,next,food,score,timer;
function reset(){snake=[{x:7,y:7}];dir=next={x:1,y:0};score=0;place();document.getElementById('score').textContent='Score: 0';document.getElementById('over').style.display='none';clearInterval(timer);timer=setInterval(tick,130)}
function place(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(snake.some(s=>s.x===food.x&&s.y===food.y))place()}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(timer);document.getElementById('final').textContent='Game over! Score: '+score;document.getElementById('over').style.display='block';return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById('score').textContent='Score: '+score;place()}else snake.pop();
  x.fillStyle='#0b141a';x.fillRect(0,0,330,330);
  x.fillStyle='#ff5252';x.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
  snake.forEach((s,i)=>{x.fillStyle=i?'#25d366':'#a7f3c9';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})}
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function turn(d){const nd=DIRS[d];if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y))next=nd}
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.d)));
document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){turn(k);e.preventDefault()}});
let tx,ty;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;if(Math.abs(dx)+Math.abs(dy)>24){turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));tx=e.touches[0].clientX;ty=e.touches[0].clientY}e.preventDefault()},{passive:false});
reset();
</script>
</body>
</html>
